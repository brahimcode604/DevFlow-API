name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devflow
          POSTGRES_PASSWORD: devflow_test_only
          POSTGRES_DB: devflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devflow -d devflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://devflow:devflow_test_only@localhost:5432/devflow_test?schema=public
      JWT_SECRET: test-only-secret-key-with-at-least-thirty-two-characters
      JWT_EXPIRES_IN_SECONDS: 900
      CORS_ORIGIN: http://localhost:5173
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:deploy
      - run: npm test
